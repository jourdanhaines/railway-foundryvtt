version: "3.9"

services:
  foundry:
    image: felddy/foundryvtt:13
    hostname: my_hostname
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD}
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp