version: "3.9"

services:
  foundry:
    image: felddy/foundryvtt:13
    hostname: ${HOSTNAME}
    user: 421:421
    volumes:
      - foundry_data:/data
    environment:
      HOSTNAME: ${HOSTNAME}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD}
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host